# 部署刷写/配网页到 GitHub Pages（web/ 目录）
# push main 或手动触发；与固件编译（build.yml，仅 tag 触发）互不影响。
name: pages
run-name: ${{ github.sha }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Fetch latest firmware (同源托管，网页可直接 fetch)
        run: |
          mkdir -p web/firmware
          curl -sL -o web/firmware/bambu-monitor.ino.merged.bin             https://github.com/Nova2003-emoji/bambu-monitor/releases/latest/download/bambu-monitor.ino.merged.bin || true
          ls -la web/firmware

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5