# 部署刷写/配网页到 GitHub Pages（web/ 目录）
# push main 或手动触发；与固件编译（build.yml，仅 tag 触发）互不影响。
name: pages
run-name: ${{ github.sha }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Fetch latest firmware (同源托管，网页可直接 fetch)
        run: |
          mkdir -p web/firmware
          curl -sL -o web/firmware/bambu-monitor.ino.merged.bin             https://github.com/Nova2003-emoji/bambu-monitor/releases/latest/download/bambu-monitor.ino.merged.bin || true
          curl -sL -o web/firmware/bambu-monitor.ino.bin             https://github.com/Nova2003-emoji/bambu-monitor/releases/latest/download/bambu-monitor.ino.bin || true
          curl -sL -o web/firmware/version.json             https://github.com/Nova2003-emoji/bambu-monitor/releases/latest/download/version.json || true
          python3 - <<'PY'
          import json, urllib.request
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/Nova2003-emoji/bambu-monitor/releases?per_page=6",
                  headers={"User-Agent": "pages-deploy"})
              rels = json.load(urllib.request.urlopen(req))
          except Exception as e:
              print("releases api failed:", e); rels = []
          index = []
          for r in rels:
              tag = r.get("tag_name", "")
              for a in r.get("assets", []):
                  if a.get("name") == "bambu-monitor.ino.bin":   # 历史=app bin（程序区@0x10000）
                      dst = "web/firmware/" + tag + ".bin"
                      try:
                          urllib.request.urlretrieve(a["browser_download_url"], dst)
                          index.append({"version": tag, "file": tag + ".bin",
                                        "published": r.get("published_at", "")})
                          print("fetched", dst)
                      except Exception as e:
                          print("skip", tag, ":", e)
          json.dump(index, open("web/firmware/index.json", "w"))
          print("history index:", len(index), "versions")
          PY
          ls -la web/firmware

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5