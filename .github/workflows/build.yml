# 自动编译固件：push 到 main（或手动触发）后用 arduino-cli 编译 ESP32 固件，
# 产物上传为 Actions artifact（Actions 页可下载 .bin/.elf）。
name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Arduino CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install GxEPD2
          arduino-cli lib install U8g2_for_Adafruit_GFX
          arduino-cli lib install ArduinoJson
          arduino-cli lib install NTPClient

      - name: Apply GxEPD2 Z96 patch (HINK-E042A13-A0 driver from ref firmware)
        run: |
          GX="$HOME/Arduino/libraries/GxEPD2"
          cp patches/GxEPD2_420_Z96.h   "$GX/src/gdeh/"
          cp patches/GxEPD2_420_Z96.cpp "$GX/src/gdeh/"
          python3 - "$GX/src/GxEPD2.h" <<EOF
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "GDEH042Z96" not in s:
              s = s.replace("      GDEY042Z98,", "      GDEY042Z98,\n      GDEH042Z96,", 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          grep -q GDEH042Z96 "$GX/src/GxEPD2.h"

      - name: Prepare local config.h (example 为无凭据占位)
        run: cp config.example.h config.h

      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --output-dir build .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: bambu-monitor-firmware
          path: build/
          if-no-files-found: error