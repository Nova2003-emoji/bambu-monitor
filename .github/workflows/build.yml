# 自动编译固件：push 到 main（或手动触发）后用 arduino-cli 编译 ESP32 固件，
# 产物上传为 Actions artifact（Actions 页可下载 .bin/.elf）。
name: build
run-name: ${{ github.sha }}

on:
  push:
    tags: [ 'v*' ]          # 仅打 v* tag 时编译并发布 Release；push main 不触发
  workflow_dispatch:

permissions:
  contents: write           # 供 release 上传附件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libs
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install GxEPD2
          arduino-cli lib install U8g2_for_Adafruit_GFX
          arduino-cli lib install ArduinoJson
          arduino-cli lib install NTPClient
          arduino-cli lib install Time

      - name: Patch GxEPD2
        run: |
          GX="$HOME/Arduino/libraries/GxEPD2"
          cp patches/GxEPD2_420_Z96.h   "$GX/src/gdeh/"
          cp patches/GxEPD2_420_Z96.cpp "$GX/src/gdeh/"
          python3 - "$GX/src/GxEPD2.h" "$GX/src/GxEPD2_BW.h" <<EOF
          import sys
          def patch(p, old, new, mark):
              s = open(p, encoding="utf-8").read()
              if mark not in s:
                  s = s.replace(old, new, 1)
                  open(p, "w", encoding="utf-8").write(s)
                  print("patched", p)
              else:
                  print("already", p)
          h, bw = sys.argv[1], sys.argv[2]
          patch(h, "      GDEY042Z98,", "      GDEY042Z98,\n      GDEH042Z96,", "GDEH042Z96")
          s = open(bw, encoding="utf-8").read()
          if "GxEPD2_420_Z96" not in s:      # 官方 GxEPD2_BW.h 无 Z96 自动加载段，补上
              s += '\n#if __has_include("gdeh/GxEPD2_420_Z96.h")\n#include "gdeh/GxEPD2_420_Z96.h"\n#endif\n'
              open(bw, "w", encoding="utf-8").write(s)
              print("patched", bw)
          else:
              print("already", bw)
          EOF
          grep -q GDEH042Z96 "$GX/src/GxEPD2.h"

      - name: Write fw_version.h CI tag UTC short commit
        run: printf '#pragma once\n#define FW_VERSION "CI %s"\n#define FW_BUILT "%s UTC commit=%s"\n' "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%S)" "${GITHUB_SHA:0:7}" > fw_version.h

      - name: Generate firmware metadata (version.json)
        run: |
          mkdir -p build
          printf '{"version":"%s","built":"%s","commit":"%s"}\n' \
            "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA:0:7}" \
            > build/version.json

      - name: Make config.h
        run: cp config.example.h config.h

      - name: Compile
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --output-dir build .

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bambu-monitor-firmware
          path: build/
          if-no-files-found: error

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.bin
            build/version.json
          generate_release_notes: true