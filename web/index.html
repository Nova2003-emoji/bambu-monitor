<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bambu Monitor — 刷写 & 配网</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f5f7fa;color:#333;padding:16px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,600px) minmax(0,380px);gap:16px;align-items:start}
@media (max-width:1020px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin-bottom:12px;color:#0969da}
label{display:block;font-size:13px;color:#666;margin:10px 0 4px}
input{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
input:read-only{background:#f4f6f8;color:#555}
.row{display:flex;gap:8px}
.row input{flex:1}
button{padding:10px 14px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:#0969da;color:#fff}
.btn-ghost{background:#eef2f6;color:#333}
.btn-danger{background:#fbe9e7;color:#c0392b}
.btn:disabled{opacity:.5;cursor:not-allowed}
#log,#serialMon{background:#1e1e1e;color:#7ee787;font-size:12px;padding:10px;border-radius:8px;margin-top:12px;overflow-y:auto;white-space:pre-wrap;font-family:Consolas,monospace}
#log{max-height:180px}
#serialMon{height:420px}
.tip{font-size:12px;color:#888;margin-top:8px;line-height:1.6;word-break:break-all}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid #ebf0f4;border-radius:10px;padding:10px 12px}
.step .n{width:22px;height:22px;border-radius:50%;background:#0969da;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step .info{flex:1;font-size:13px;color:#555}
.file-btn{display:inline-block;background:#fff;border:1px dashed #b8c4d0;border-radius:8px;padding:8px 12px;font-size:13px;color:#0969da;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sticky-card{position:sticky;top:16px}
.mon-head{display:flex;justify-content:space-between;align-items:center}
.mon-head button{padding:4px 10px;font-size:12px;background:#eef2f6;color:#555;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <h1>🖥 Bambu Monitor 刷写 & 配网</h1>
    <div class="sub">先刷固件，后配网络。全程走浏览器 Web Serial，数据只到你的设备，不上传任何服务器。</div>

    <div class="card">
      <h2>① 刷写固件</h2>
      <div class="steps">
        <div class="step">
          <div class="n">1</div>
          <div class="info">连接设备的 USB 串口</div>
          <button class="btn-ghost" onclick="connectSerial()">🔌 串口连接</button>
        </div>
        <div class="step">
          <div class="n">2</div>
          <div class="info">选择固件文件（merged.bin 或 .bin）</div>
          <label class="file-btn">📁 选择文件
            <input type="file" id="fwFile" accept=".bin" style="display:none">
          </label>
          <span id="fwName" style="font-size:12px;color:#888"></span>
        </div>
        <div class="step">
          <div class="n">3</div>
          <div class="info">写入设备（请勿中途拔线）</div>
          <button class="btn-primary" onclick="doFlash()" id="flashBtn" disabled>⚡ 开始刷写</button>
        </div>
      </div>
      <div class="tip">请用 Chrome / Edge 打开。刷写完成后建议刷新本页再进行 ② 配网。</div>
      <div id="log"></div>
    </div>

    <div class="card">
      <h2>② 配网 & 令牌</h2>
      <label>WiFi 名称</label>
      <input id="ssid" placeholder="你的 WiFi SSID">
      <label>WiFi 密码</label>
      <input id="pass" placeholder="WiFi 密码">
      <label>Home Assistant 长期令牌（HA 设置 → 长期访问令牌）</label>
      <input id="token" placeholder="eyJhbGciOiJ...">
      <label>城市 / 经纬度（城市名可自动查）</label>
      <div class="row">
        <input id="city" placeholder="城市名">
        <button class="btn-ghost" onclick="geocode()">查</button>
      </div>
      <div class="row">
        <input id="lat" placeholder="纬度">
        <input id="lon" placeholder="经度">
      </div>
      <div class="actions">
        <button class="btn-ghost" onclick="connectSerial()">🔌 串口连接</button>
        <button class="btn-ghost" onclick="readCfg()">📖 读取配置</button>
        <button class="btn-primary" onclick="sendCfg()" id="sendBtn" disabled>💾 保存配置</button>
        <button class="btn-danger" onclick="wipeCfg()">🗑 清空配置</button>
        <button class="btn-ghost" onclick="reboot()">重启</button>
      </div>
      <div id="cfgStatus" class="tip">连接串口后：读取配置自动填表 → 修改 → 保存 → 重启生效。清空配置会恢复出厂默认并需重新配网。</div>
    </div>
  </div>

  <div class="col">
    <div class="card sticky-card">
      <div class="mon-head">
        <h2>📟 串口监视</h2>
        <button onclick="document.getElementById('serialMon').textContent=''">清空</button>
      </div>
      <div class="tip" style="margin-top:0">设备串口原始输出实时显示（配网回显 / 刷写日志）。115200。</div>
      <pre id="serialMon"></pre>
    </div>
  </div>
</div>

<script>
const logEl = document.getElementById('log');
const monEl = document.getElementById('serialMon');
function log(msg){ logEl.style.display='block'; logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function monLog(msg){ monEl.textContent += msg; if (monEl.textContent.length > 20000) monEl.textContent = monEl.textContent.slice(-15000); monEl.scrollTop = monEl.scrollHeight; }

/* ---------- ① 刷写固件（esptool-js 本地库 + 手动选文件） ---------- */
let loader = null;
let fwData = null;

async function connectSerial(){
  if (port) { log('串口已连接 ✓（无需重复连接）'); return; }
  if (!('serial' in navigator)) { alert('此浏览器不支持 Web Serial，请用 Chrome/Edge'); return; }
  try {
    log('请求串口（请在弹出的列表选设备）...');
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    document.getElementById('sendBtn').disabled = false;
    log('串口已连接 ✓（设备回显见右侧监视器；刷写会自动独占端口）');
    lineBuf = '';
    readCfgLoop();
  } catch(e){ log('连接失败: ' + (e.message||e)); }
}

document.getElementById('fwFile').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if (!f) return;
  try {
    const b = await f.arrayBuffer();
    fwData = new Uint8Array(b);
    document.getElementById('fwName').textContent = f.name + ' (' + (b.byteLength/1024).toFixed(0) + 'KB)';
    log('已选择固件: ' + f.name);
  } catch(err){ log('读取文件失败: ' + err); }
  maybeEnableFlash();
});

function maybeEnableFlash(){
  document.getElementById('flashBtn').disabled = !(loader && fwData);
}

async function doFlash(){
  if (!loader || !fwData){ alert('请先连接设备并选择固件'); return; }
  const btn = document.getElementById('flashBtn');
  btn.disabled = true;
  try {
    // 统一连接：停配网监视并让 esptool 独占同一端口（无需重新选串口）
    cfgRun = false;
    try { await cfgReader?.cancel(); } catch(e){}
    try { writer?.releaseLock(); } catch(e){}
    writer = null;
    const { ESPLoader } = await import('./vendor2/dist/index.js');
    loader = new ESPLoader(port, {
      log:   (m)=>monLog(m + '
'),
      debug: (m)=>monLog(m + '
'),
      error: (m)=>{ monLog(m + '
'); log('⚠ ' + m); },
      info:  (m)=>monLog(m + '
'),
    });
    log('初始化设备...');
    await loader.initialize();
    log('上传加速桩...');
    const stub = await loader.runStub();   // 必须用返回的 stub 实例烧写
    log('写入固件（请勿拔线），4MB 约 6-8 分钟…');
    await stub.flashData(fwData, 0, (n)=>log('  已写 ' + (n/1024).toFixed(0) + ' KB'));
    await stub.flashFinish();
    log('✅ 刷写完成！设备将重启，可到 ② 配网。');
  } catch(e){ log('❌ 刷写失败: ' + (e.message||e)); }
  finally {
    btn.disabled = false;
    // 烧写完恢复同一端口的配网监视
    try { await port.close(); } catch(e){}
    try { await port.open({ baudRate: 115200 }); writer = port.writable.getWriter(); lineBuf=''; readCfgLoop(); log('串口已恢复配网监视'); }
    catch(e){ log('烧写后串口恢复失败，请刷新页面重连'); }
  }
}

/* ---------- ② 配网 ---------- */
let port = null, writer = null, cfgReader = null, cfgRun = false;
let lineBuf = '';

// 配网模式读循环：设备输出实时进监视器；[CFGD] 行解析回填表单
async function readCfgLoop(){
  if (cfgRun) return;
  cfgRun = true;
  const dec = new TextDecoder();
  try {
    cfgReader = port.readable.getReader();
    while (cfgRun) {
      const { value, done } = await cfgReader.read();
      if (done) break;
      if (value && value.length) {
        const text = dec.decode(value);
        monLog(text);
        lineBuf += text;
        let idx;
        while ((idx = lineBuf.indexOf('\n')) >= 0) {
          const line = lineBuf.slice(0, idx).trim();
          lineBuf = lineBuf.slice(idx + 1);
          handleDeviceLine(line);
        }
      }
    }
  } catch(e){ monLog('\n[串口读取结束] ' + (e.message||e) + '\n'); }
  cfgRun = false;
}

function handleDeviceLine(line){
  if (!line.startsWith('[CFGD] ')) return;
  try {
    const map = {};
    for (const kv of line.slice(7).split(' ')) {
      const i = kv.indexOf('=');
      if (i > 0) map[kv.slice(0, i)] = kv.slice(i + 1);
    }
    if (map.ssid)  document.getElementById('ssid').value  = map.ssid;
    if (map.pass)  document.getElementById('pass').value  = map.pass;
    if (map.token) document.getElementById('token').value = map.token;
    if (map.city)  document.getElementById('city').value  = map.city;
    if (map.lat)   document.getElementById('lat').value   = map.lat;
    if (map.lon)   document.getElementById('lon').value   = map.lon;
    log('📖 已读取设备配置并填充表单 ✓');
  } catch(e){}
}

async function readCfg(){
  if (!port || !writer) { alert('请先连接串口'); return; }
  try {
    await writer.write(new TextEncoder().encode('cfgget\n'));
    log('已发送 cfgget，等待设备回填表单…');
  } catch(e){ log('发送失败: ' + e); }
}

async function wipeCfg(){
  if (!port || !writer) { alert('请先连接串口'); return; }
  if (!confirm('确定清空设备上的全部配置？\n（WiFi / 城市 / HA 令牌都会恢复出厂默认，需要重新配网）')) return;
  try {
    await writer.write(new TextEncoder().encode('cfgwipe\n'));
    log('已发送 cfgwipe → 设备恢复默认。点“重启”生效，之后需重新配网。');
  } catch(e){ log('发送失败: ' + e); }
}

async function geocode(){
  const city = document.getElementById('city').value.trim();
  if (!city) return;
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1&countryCode=CN&language=zh');
    const d = await r.json();
    if (d && d.results && d.results[0]) {
      document.getElementById('lat').value = d.results[0].latitude.toFixed(5);
      document.getElementById('lon').value = d.results[0].longitude.toFixed(5);
      document.getElementById('city').value = d.results[0].name;
      log('城市 → ' + d.results[0].name + ' ' + d.results[0].latitude.toFixed(5) + ',' + d.results[0].longitude.toFixed(5));
    } else log('未找到城市');
  } catch(e){ log('查城市失败: ' + e); }
}

async function sendCfg(){
  if (!port || !writer) { alert('请先连接串口'); return; }
  const parts = [];
  const ssid = document.getElementById('ssid').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const token = document.getElementById('token').value.trim();
  const city = document.getElementById('city').value.trim();
  const lat = document.getElementById('lat').value.trim();
  const lon = document.getElementById('lon').value.trim();
  if (ssid)  parts.push('ssid=' + ssid);
  if (pass)  parts.push('pass=' + pass);
  if (token) parts.push('token=' + token);
  if (city)  parts.push('city=' + city);
  if (lat)   parts.push('lat=' + lat);
  if (lon)   parts.push('lon=' + lon);
  if (!parts.length) { alert('请至少填一项'); return; }
  try {
    await writer.write(new TextEncoder().encode('cfg ' + parts.join(' ') + '\n'));
    log('已发送 cfg（' + parts.map(p=>p.split('=')[0]).join(', ') + '）→ 设备回显见监视器');
  } catch(e){ log('发送失败: ' + e); }
}

async function reboot(){
  if (!port || !writer) { alert('请先连接串口'); return; }
  try { await writer.write(new TextEncoder().encode('r\n')); log('已发送重启，设备将按新配置启动。'); }
  catch(e){ log('发送失败: ' + e); }
}
</script>
</body>
</html>
